# Builds and publishes TV packages only when started manually.
# It never syncs this fork with the upstream repository.
name: Publish TV packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Samsung packages must be signed locally with `python3 tizen/build.py
      # --generic --sign-default` before they are attached to a release. GitHub
      # runners have no Tizen SDK, so publishing their unsigned WGT causes TV
      # installation error 118.
      - name: Build generic LG package
        run: |
          python3 webos/build.py --generic

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            FreeMyTV-webos.ipk \
            --target "$GITHUB_SHA" \
            --title "Free My TV ${RELEASE_TAG#v} – Samsung logo fix" \
            --notes "First fork release with Samsung installed-app permission, resilient icon loading, shelf recovery, and localized API error reporting. The LG package is generic and contains no personal configuration or API keys. Upload the locally signed Samsung WGT separately; unsigned WGT files are intentionally never published."

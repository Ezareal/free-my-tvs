# Builds and publishes TV packages only when started manually.
# It never syncs this fork with the upstream repository.
name: Publish TV packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build generic Samsung and LG packages
        run: |
          python3 tizen/build.py --generic
          python3 webos/build.py --generic

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            FreeMyTV-tizen.wgt \
            FreeMyTV-webos.ipk \
            --target "$GITHUB_SHA" \
            --title "Free My TV ${RELEASE_TAG#v} – Samsung logo fix" \
            --notes "First fork release with Samsung installed-app permission, resilient icon loading, shelf recovery, and localized API error reporting. The packages are generic and contain no personal configuration or API keys."

mode: ContinuousDeployment
next-version: 1.0.0
tag-prefix: '[vV]?'
commit-message-incrementing: Enabled
major-version-bump-message: '(^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE:|major:)'
minor-version-bump-message: '^feat(\([^)]+\))?:'
patch-version-bump-message: '^(fix|build|chore|ci|docs|style|refactor|perf|test)(\([^)]+\))?:'
branches:
  production:
    label: ''
    increment: Patch
    regex: ^main$|^master$|^prod(uction)?$
    is-main-branch: true
  staging:
    mode: ContinuousDelivery
    label: rc
    increment: Patch
    regex: ^stag(ing)?$
  qa:
    mode: ContinuousDelivery
    label: beta.qa
    increment: Patch
    regex: ^qa$
  testing:
    mode: ContinuousDelivery
    label: beta.test
    increment: Patch
    regex: ^test(ing)?$
  development:
    mode: ContinuousDelivery
    label: alpha
    increment: Minor
    regex: ^dev(elop)?(ment)?$

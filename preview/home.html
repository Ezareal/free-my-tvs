<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free My TV · anteprima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: F1; font-display: swap;

  @font-face { font-family: MGP; font-display: swap;
    src: url('fonts/MGPDisplay-Bold.woff2') format('woff2'), url('https://www.motogp.com/resources/v8.28.8/fonts/MGPDisplay-Bold.woff2') format('woff2'); }
  .flag { position: absolute; bottom: 44px; height: 56px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .place { position: absolute; bottom: 44px; font-size: 36px; font-weight: 500; line-height: 56px; }
  #gallery { position: absolute; inset: 0; background: rgba(10,10,12,.94); display: none; z-index: 20; color: #fff; }

  #gallery .cell { position: absolute; width: 1040px; height: 442px; transform: scale(.55); transform-origin: 0 0; cursor: pointer; }
  #gallery .cell .card { top: 0; left: 0 !important; width: 1040px !important; transition: none; }
  #gallery .lab { position: absolute; font-size: 26px; font-weight: 600; color: #ddd; }

  .night { --ink:#fff; --dim:#8e8e93; --faint:rgba(255,255,255,.7); --glass:rgba(40,40,44,.55); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #111; overflow: hidden; font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
           background: linear-gradient(#f5f5f7, #e2e2e7); color: var(--ink); transition: background .6s; }

  #bg { position: absolute; inset: 0; opacity: .5; transition: background .8s; filter: blur(80px); }
  .abs { position: absolute; }

  #clock { left: 0; width: 1920px; top: 62px; text-align: center; font-size: 64px; font-weight: 600; letter-spacing: .004em; line-height: 90px; pointer-events: none; }
  .tab { top: 158px; height: 68px; padding: 0 26px; border-radius: 34px; font-size: 30px; font-weight: 500; line-height: 68px; color: var(--dim); cursor: pointer; }
  .tab.on { color: var(--ink); font-weight: 600; }
  .btn { top: 69px; width: 68px; height: 68px; border-radius: 34px; background: var(--glass); backdrop-filter: blur(20px); overflow: hidden;
         box-shadow: 0 6px 26px rgba(0,0,0,.12), inset 0 0 0 1px rgba(255,255,255,.35); display: grid; place-items: center; }
  .btn svg { width: 30px; height: 30px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #avatar { background: #4285f4; color: #fff; font-weight: 600; font-size: 34px; }
  #avatar img { width: 100%; height: 100%; object-fit: cover; }
  #caption { right: 80px; top: 158px; height: 68px; line-height: 68px; font-size: 30px; font-weight: 500; color: var(--dim); }
  .card { position: absolute; top: 262px; height: 442px; border-radius: 18px; overflow: hidden; background: #2c2c2e;
          box-shadow: 0 24px 50px rgba(0,0,0,.28); transition: left .5s cubic-bezier(.3,.8,.3,1), width .5s cubic-bezier(.3,.8,.3,1), transform .25s, box-shadow .25s; }
  .card.focus { transform: translateY(-6px) scale(1.04); box-shadow: 0 34px 70px rgba(0,0,0,.4), 0 0 0 3px rgba(255,255,255,.85) inset; }
  .cap { position: absolute; top: 718px; font-size: 31px; font-weight: 600; white-space: nowrap; transition: left .5s cubic-bezier(.3,.8,.3,1); }
  .cap small { display: block; font-size: 25px; font-weight: 500; color: var(--dim); margin-top: 6px; }
  .layer { position: absolute; inset: 0; background-size: cover; background-position: center 38%; transition: opacity .45s; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,.25) 28%, rgba(0,0,0,0) 55%); }
  .lg { position: absolute; object-fit: contain; transition: opacity .45s; filter: drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  .lg.p { left: 12%; width: 76%; bottom: 6.5%; height: 16%; object-position: center bottom; }
  .lg.w { right: 3.5%; width: 34%; bottom: 7%; height: 26%; object-position: right bottom; }
  .ttl { position: absolute; color: #fff; font-weight: 600; text-shadow: 0 2px 14px rgba(0,0,0,.55); transition: opacity .45s; }
  .ttl.p { left: 0; right: 0; bottom: 34px; font-size: 34px; text-align: center; }
  .ttl.w { right: 40px; bottom: 30px; font-size: 44px; text-align: right; }
  .rank { position: absolute; left: 20px; top: 6px; font-size: 84px; font-weight: 600; color: #fff; text-shadow: 0 3px 9px rgba(0,0,0,.8); line-height: 1.1; }
  .card .p { opacity: 1; } .card .w { opacity: 0; }
  .card.sel .p { opacity: 0; } .card.sel .w { opacity: 1; }
  .sport { color: #fff; text-align: center; background-size: cover; }
  .sport .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .sport .tint { position: absolute; inset: 0; }
  .sport .comp { position: absolute; left: 0; right: 0; top: 28px; height: 80px; display: flex; justify-content: center; align-items: center;
                 font-size: 34px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .sport .comp img { max-width: 300px; max-height: 80px; filter: brightness(0) invert(1); }
  .sport .crest { position: absolute; top: 124px; width: 190px; height: 190px; display: grid; place-items: center; font-size: 84px; font-weight: 600; border-radius: 50%; background: rgba(255,255,255,.2); }
  .sport .crest img { width: 100%; height: 100%; object-fit: contain; }
  .sport .nm { position: absolute; top: 346px; width: 440px; font-size: 27px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sport .when { position: absolute; left: 0; right: 0; top: 200px; font-size: 36px; font-weight: 500; }
  #platter { left: 80px; top: 814px; width: 1760px; height: 168px; border-radius: 44px; background: var(--glass); backdrop-filter: blur(30px);
             box-shadow: 0 20px 60px rgba(0,0,0,.14), inset 0 0 0 1px rgba(255,255,255,.4); }
  .tile { position: absolute; top: 21px; width: 204px; height: 126px; border-radius: 22px; display: grid; place-items: center; color: #fff; font-weight: 600; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
  #quote { right: 100px; top: 740px; font-size: 21px; color: var(--faint); }
  #bar { position: fixed; left: 12px; bottom: 10px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 9; font: 12px/1.4 system-ui, sans-serif; color: #ccc; }
  #bar span, #bar button { background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 8px; border: 0; color: #ccc; font: inherit; cursor: pointer; }
  #panel { position: fixed; right: 12px; bottom: 48px; width: 360px; background: #1c1c1e; color: #ddd; border-radius: 14px; padding: 16px; z-index: 10; display: none; font: 13px/1.4 system-ui, sans-serif; max-height: 80vh; overflow: auto; }
  #panel label { display: block; margin-top: 10px; color: #aaa; font-size: 12px; }
  #panel input, #panel select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid #444; background: #2c2c2e; color: #fff; margin-top: 3px; }
  #panel button { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 8px; background: #0a84ff; color: #fff; font-weight: 600; cursor: pointer; }
  #panel p { color: #999; margin-top: 10px; font-size: 12px; }
  #log { white-space: pre-wrap; font: 11px/1.5 ui-monospace, monospace; color: #9fe39f; margin-top: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div id="title" class="abs">Per te</div>
  <div id="clock" class="abs"></div>
  <div id="tabs"></div>
  <div id="caption" class="abs"></div>
  <div id="btns"></div>
  <div id="cards"></div>
  <div id="platter" class="abs"></div>
  <div id="quote" class="abs"></div>
  <div id="gallery"></div>
</div>
<div id="bar">
  <button id="gear">⚙ Impostazioni e dati veri</button>
  <span id="status">Dati di esempio: apri le impostazioni e inserisci la chiave TMDB</span>
  <button id="gal">▦ Prova tutti gli sport (G)</button><span>← → muovi · 1 2 3 schede · S evento sport · G galleria sport · N giorno/notte · D dati</span>
</div>
<div id="panel">
  <b>Dati reali</b>
  <p>Tutto resta nel tuo browser (localStorage): chiavi e sessione non vanno da nessuna parte tranne che ai rispettivi servizi.</p>
  <label>Chiave TMDB (API key o Read Access Token)<input id="f-key" type="password" autocomplete="off"></label>
  <label>Sessione TMDB (facoltativa, per i tuoi gusti in Esplora)<input id="f-session" type="password" autocomplete="off"></label>
  <label>Paese (2 lettere)<input id="f-region" maxlength="2"></label>
  <label>Lingua<select id="f-lang"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option></select></label>
  <label>Chiave football-data.org (Serie A e Champions; può essere bloccata dal browser)<input id="f-football" type="password" autocomplete="off"></label>
  <label>Foto profilo (link)<input id="f-photo"></label>
  <label>Nome profilo<input id="f-name"></label>
  <button id="f-go">Carica dati</button> <button id="f-test" style="background:#444">Test loghi</button>
  <div id="log"></div>
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(innerWidth / 1920, (innerHeight - 40) / 1080); stage.style.transform = 'scale(' + s + ')';
    stage.style.left = (innerWidth - 1920 * s) / 2 + 'px'; stage.style.top = '0px'; }
  addEventListener('resize', fit); fit();

  // ---------- settings ----------
  var cfg = { key: '', session: '', region: 'IT', lang: 'it', football: '', photo: '', name: 'R' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('fmtv') || '{}')); } catch (e) {}
  var ids = { key: 'f-key', session: 'f-session', region: 'f-region', lang: 'f-lang', football: 'f-football', photo: 'f-photo', name: 'f-name' };
  Object.keys(ids).forEach(function (k) { document.getElementById(ids[k]).value = cfg[k]; });
  document.getElementById('gear').onclick = function () { var p = document.getElementById('panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
  var logEl = document.getElementById('log');
  function log(s) { logEl.textContent += s + '\n'; console.log(s); }
  function status(s) { document.getElementById('status').textContent = s; }

  // ---------- texts ----------
  var TXT = {
    it: { title: 'Per te', tabs: ['Esplora', 'Film', 'Serie TV'], top: 'Top 10 in ', today: 'Oggi', tomorrow: 'Domani', live: 'In diretta', quali: 'Qualifiche', race: 'Gara', series: 'Serie', seasons: ['stagione', 'stagioni'], loc: 'it-IT', tm: 'it-IT' },
    en: { title: 'For You', tabs: ['Explore', 'Movies', 'Shows'], top: 'Top 10 in ', today: 'Today', tomorrow: 'Tomorrow', live: 'Live now', quali: 'Qualifying', race: 'Race', series: 'Series', seasons: ['season', 'seasons'], loc: 'en-US', tm: 'en-US' },
    es: { title: 'Para ti', tabs: ['Explorar', 'Películas', 'Series'], top: 'Top 10 en ', today: 'Hoy', tomorrow: 'Mañana', live: 'En vivo', quali: 'Clasificación', race: 'Carrera', series: 'Serie', seasons: ['temporada', 'temporadas'], loc: 'es-ES', tm: 'es-ES' },
    pt: { title: 'Para você', tabs: ['Explorar', 'Filmes', 'Séries'], top: 'Top 10 em ', today: 'Hoje', tomorrow: 'Amanhã', live: 'Ao vivo', quali: 'Classificação', race: 'Corrida', series: 'Série', seasons: ['temporada', 'temporadas'], loc: 'pt-BR', tm: 'pt-BR' }
  };
  function T() { return TXT[cfg.lang] || TXT.it; }

  // ---------- placeholder data (until real data is loaded) ----------
  function ph(t, c1, c2, meta) { return { title: t, c1: c1, c2: c2, meta: meta || '' }; }
  var data = {
    movies: [ph('Il Gladiatore II', '#c0392b', '#2c0b0b', 'Azione · Prime Video'), ph('Dune: Parte Due', '#d9a441', '#3b2a0c', 'Fantascienza · Netflix'), ph('Inside Out 2', '#6c5ce7', '#1b1240', 'Animazione · Disney+'),
             ph('Oppenheimer', '#e67e22', '#1c0d02', 'Dramma · Prime Video'), ph('Gran Turismo', '#16a085', '#05211c', 'Azione · Netflix'), ph('Barbie', '#ff4fa3', '#4a0b2c', 'Commedia · Netflix'),
             ph('Interstellar', '#2d6cdf', '#06142e', 'Fantascienza'), ph('Joker', '#27ae60', '#07200f', 'Thriller'), ph('Avatar', '#00b8d9', '#021f27', 'Fantascienza'), ph('Top Gun: Maverick', '#95a5a6', '#1b2224', 'Azione')],
    shows: [ph('The Boys', '#e74c3c', '#2a0707', 'Serie · Prime Video'), ph('Stranger Things', '#d63031', '#1a0505', 'Serie · Netflix'), ph('Il Trono di Spade', '#8395a7', '#10161c', 'Serie'),
            ph('Breaking Bad', '#27ae60', '#06200d', 'Serie'), ph('Succession', '#5f6c7b', '#0d1117', 'Serie'), ph('The Bear', '#f39c12', '#2a1a02', 'Serie'),
            ph('Squid Game', '#ff2e93', '#2b0418', 'Serie'), ph('Black Mirror', '#34495e', '#06090d', 'Serie'), ph('Shogun', '#b33939', '#1d0707', 'Serie'), ph('Gomorra', '#7f8c8d', '#121516', 'Serie')],
    explore: [ph('Dune: Parte Due', '#d9a441', '#3b2a0c'), ph('Inside Out 2', '#6c5ce7', '#1b1240')],
    sports: [
      { sport: 1, comp: 'UEFA Champions League', start: Date.now() + 3600e3, minutes: 115, home: 'Inter', away: 'Barcellona', logoComp: '', logoHome: '', logoAway: '', art: '../app/assets/sports/champions.webp', c1: '#1b2a8a', c2: '#0b1250', italian: 3 },
      { sport: 2, comp: 'UEFA Europa League', start: Date.now() - 600e3, minutes: 115, home: 'Roma', away: 'Ajax', logoComp: '', logoHome: '', logoAway: '', art: '../app/assets/sports/europa.jpg', c1: '#e8650a', c2: '#2a0f02', italian: 3 },
      { sport: 0, comp: 'Serie A', start: Date.now() + 20 * 3600e3, minutes: 115, home: 'Milan', away: 'Napoli', logoComp: '', logoHome: '', logoAway: '', art: '', c1: '#0b5fa5', c2: '#052a4a', italian: 3 },
      { sport: 3, comp: 'Formula 1', start: Date.now() + 26 * 3600e3, minutes: 120, title: "Gran Premio d'Italia · Gara", logoComp: '', art: '../app/assets/sports/f1.png', country: 'it', place: 'Monza', c1: '#14141C', c2: '#14141C', italian: 3 },
      { sport: 4, comp: 'MotoGP', start: Date.now() + 27 * 3600e3, minutes: 75, title: "Gran Premio d'Italia · Gara", logoComp: '', art: '', country: 'it', place: 'Mugello', c1: '#0E0E12', c2: '#0E0E12', italian: 3 }
    ]
  };
  data.sports.forEach(function (e) { e.sample = true; });
  var ACCENT = [['#0b5fa5', '#052a4a'], ['#1b2a8a', '#0b1250'], ['#e8650a', '#2a0f02'], ['#14141C', '#14141C'], ['#0E0E12', '#0E0E12'], ['#2e8b57', '#0b2a1a']];

  // ---------- state & chrome ----------
  var tab = 0, idx = 0, sportIdx = -1, night = false;
  var tabsEl = document.getElementById('tabs'), cardsEl = document.getElementById('cards'), captionEl = document.getElementById('caption'), bgEl = document.getElementById('bg');
  var APPS = [['Netflix', '#e50914'], ['YouTube', '#ff0033'], ['Prime Video', '#1a98ff'], ['Nuvio TV', '#8b5cf6'], ['Mono Player', '#22a7f0'], ['Disney+', '#1838c8'], ['Apple TV', '#8a8d96'], ['Spotify', '#1db954']];
  var ICONS = ['<path d="M3 6h18v12H3zM8 21h8"/>', '<path d="M4 6h16v12H4zM8 10h2M14 10h2"/>', '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M18.4 5.6l-2 2M7.6 16.4l-2 2"/>'];
  var btns = document.getElementById('btns'), right = 1840;
  for (var b = 3; b >= 0; b--) {
    var e = document.createElement('div'); e.className = 'btn abs'; e.style.left = (right - 68) + 'px'; right -= 88;
    if (b === 3) e.id = 'avatar'; else e.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[b] + '</svg>';
    btns.appendChild(e);
  }
  function avatar() {
    var a = document.getElementById('avatar'); a.innerHTML = '';
    if (cfg.photo) { var i = document.createElement('img'); i.src = cfg.photo; i.onerror = function () { a.textContent = (cfg.name || 'R')[0].toUpperCase(); }; a.appendChild(i); }
    else a.textContent = (cfg.name || 'R')[0].toUpperCase();
  }
  var platter = document.getElementById('platter');
  APPS.forEach(function (a, i) {
    var t = document.createElement('div'); t.className = 'tile'; t.textContent = a[0]; t.style.left = (24 + i * 218) + 'px';
    t.style.background = 'linear-gradient(145deg,' + a[1] + ',#000 160%)'; t.style.fontSize = a[0].length > 9 ? '25px' : '30px'; platter.appendChild(t);
  });
  function drawTabs() {
    tabsEl.innerHTML = ''; var x = 54;
    T().tabs.forEach(function (t, i) {
      var d = document.createElement('div'); d.className = 'tab abs' + (i === tab ? ' on' : ''); d.textContent = t; d.onclick = function () { setTab(i); };
      tabsEl.appendChild(d); d.style.left = x + 'px'; x += d.offsetWidth + 4;
    });
    document.getElementById('title').textContent = T().title;
  }
  function clock() { var d = new Date(); document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  clock(); setInterval(clock, 15000);

  // ---------- TMDB (the same choices as the app: textless images + the title's logo in your language) ----------
  var IMG = 'https://image.tmdb.org/t/p/';
  function tmdb(path) {
    var bearer = cfg.key.indexOf('eyJ') === 0;
    var url = 'https://api.themoviedb.org/3' + path + (bearer ? '' : (path.indexOf('?') >= 0 ? '&' : '?') + 'api_key=' + encodeURIComponent(cfg.key));
    return fetch(url, bearer ? { headers: { Authorization: 'Bearer ' + cfg.key } } : {}).then(function (r) { if (!r.ok) throw new Error('TMDB ' + r.status + ' ' + path.split('?')[0]); return r.json(); });
  }
  function bestImage(list) { // textless only
    var best = null, score = -1;
    (list || []).forEach(function (b) { if (b.iso_639_1 !== null || !b.file_path) return; var s = Math.min(b.width, 3840) * 100 + (b.vote_average || 0); if (s > score) { score = s; best = b.file_path; } });
    return best;
  }
  function bestLogo(list) {
    var best = null, score = -1;
    (list || []).forEach(function (b) {
      if (!b.file_path || !/\.png$/i.test(b.file_path)) return;
      var l = b.iso_639_1 === null ? '' : b.iso_639_1, rank = l === cfg.lang ? 3 : l === 'en' ? 2 : l === '' ? 1 : 0; if (!rank) return;
      var s = rank * 1e6 + Math.min(b.width, 2000) * 10 + (b.vote_average || 0); if (s > score) { score = s; best = b.file_path; }
    });
    return best;
  }
  function details(kind, o) {
    return tmdb('/' + kind + '/' + o.id + '?language=' + T().tm + '&append_to_response=watch/providers,images&include_image_language=null,' + cfg.lang + ',en').then(function (d) {
      var im = d.images || {}, logo = bestLogo(im.logos), cleanB = bestImage(im.backdrops), cleanP = bestImage(im.posters);
      var parts = [];
      if (kind === 'tv') parts.push(T().series);
      if (d.genres && d.genres[0]) parts.push(d.genres[0].name);
      if (kind === 'movie' && d.runtime) parts.push(Math.floor(d.runtime / 60) + ' h ' + (d.runtime % 60) + ' min');
      if (kind === 'tv' && d.number_of_seasons) parts.push(d.number_of_seasons + ' ' + T().seasons[d.number_of_seasons === 1 ? 0 : 1]);
      var pr = d['watch/providers'] && d['watch/providers'].results && d['watch/providers'].results[cfg.region.toUpperCase()];
      if (pr && pr.flatrate && pr.flatrate[0]) parts.push(pr.flatrate[0].provider_name);
      var item = { title: d.title || d.name || o.title || o.name, meta: parts.join(' · '),
        backdrop: IMG + 'w1280' + (cleanB || d.backdrop_path || o.backdrop_path), backdropClean: !!(cleanB && logo),
        poster: IMG + 'w780' + (cleanP && logo ? cleanP : (d.poster_path || o.poster_path)), posterClean: !!(cleanP && logo),
        logo: logo ? IMG + 'w500' + logo : '', c1: '#555', c2: '#111' };
      return item;
    });
  }
  function top(kind) {
    return tmdb('/discover/' + kind + '?language=' + T().tm + '&region=' + cfg.region + '&watch_region=' + cfg.region
      + '&with_watch_monetization_types=flatrate%7Cfree%7Cads&include_adult=false&sort_by=popularity.desc&vote_count.gte=50').then(function (r) {
      var picks = r.results.filter(function (o) { return o.backdrop_path && o.poster_path; }).slice(0, 10);
      return Promise.all(picks.map(function (o) { return details(kind, o).catch(function () { return null; }); }));
    }).then(function (l) { return l.filter(Boolean); });
  }
  function taste() {
    if (!cfg.session) return Promise.resolve([]);
    var s = 'session_id=' + encodeURIComponent(cfg.session);
    return tmdb('/account?' + s).then(function (acc) {
      var jobs = [];
      ['movie', 'tv'].forEach(function (k) {

    var s = SAMPLE[sp], e = mk(sp, Date.now() + (3 + sp) * 36e5, s.comp, s.title || '');
    if (s.home) { e.home = s.home; e.away = s.away; }
    e.art = sp === 1 ? '../app/assets/sports/champions.webp' : sp === 2 ? '../app/assets/sports/europa.jpg' : sp === 3 ? '../app/assets/sports/f1.png' : '';
    return { e: e, real: false };
  }
  function openGallery() {
    var g = document.getElementById('gallery'); g.innerHTML = ''; g.style.display = 'block';
    el('h2', '', g).textContent = 'Tutti gli sport';
    el('div', 'hint', g).textContent = 'Clic su una card per vederla in Esplora · G o Esc per chiudere';
    for (var sp = 0; sp < 6; sp++) (function (sp) {
      var it = galleryEvent(sp), cell = el('div', 'cell', g);
      cell.style.left = (80 + (sp % 3) * 600) + 'px'; cell.style.top = (150 + Math.floor(sp / 3) * 400) + 'px';
      cell.appendChild(sportCard(it.e));
      var lab = el('div', 'lab', g); lab.style.left = (80 + (sp % 3) * 600) + 'px'; lab.style.top = (150 + Math.floor(sp / 3) * 400 + 252) + 'px';
      lab.textContent = NAMES[sp] + (it.real ? ' · dati veri' : ' · esempio');
      cell.onclick = function () { var at = data.sports.indexOf(it.e); if (at < 0) { data.sports.push(it.e); at = data.sports.length - 1; } sportIdx = at; tab = 0; idx = 0; closeGallery(); render(); };
    })(sp);
  }
  function closeGallery() { document.getElementById('gallery').style.display = 'none'; }
  document.getElementById('gal').onclick = openGallery;

  addEventListener('keydown', function (e) {
    if (e.key === 'g' || e.key === 'G') { var gg = document.getElementById('gallery'); return gg.style.display === 'block' ? closeGallery() : openGallery(); }
    if (e.key === 'Escape') return closeGallery();
    if (/INPUT|SELECT/.test((e.target || {}).tagName || '')) return;
    var max = tab === 0 ? 2 : 9;
    if (e.key === 'ArrowRight') idx = Math.min(max, idx + 1);
    else if (e.key === 'ArrowLeft') idx = Math.max(0, idx - 1);
    else if (e.key === '1' || e.key === '2' || e.key === '3') return setTab(+e.key - 1);
    else if (e.key === 's' || e.key === 'S') { sportIdx = (sportIdx + 1) % data.sports.length; if (tab !== 0) { tab = 0; idx = 0; } }
    else if (e.key === 'n' || e.key === 'N') { night = !night; stage.className = night ? 'night' : ''; return; }
    else if (e.key === 'd' || e.key === 'D') { document.getElementById('panel').style.display = 'block'; return; }
    else return;
    render();
  });
  avatar(); render();
  if (cfg.key) load();
})();
</script>
</body>
</html>
